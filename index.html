<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Are you gay? 🏳️‍🌈</title>

  <!-- Confetti library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg1: #e8dbfc;
      --bg2: #f8f0fc;
      --card: #ffffffcc;
      --yes: #9b51e0;
      --yesHover: #803bec;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 30%, #a1c4fd 70%, #c2e9fb 100%);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      padding: 16px;
    }

    /* FULL-SCREEN CONFETTI CANVAS */
    #confettiCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
    }

    .card {
      width: min(720px, 92vw);
      padding: 30px 24px;
      background: var(--card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, .12);
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    .art {
      width: min(240px, 70vw);
      margin: 0 auto 10px;
      display: block;
      filter: drop-shadow(0 10px 14px rgba(0, 0, 0, .1));
    }

    h1 {
      font-size: clamp(28px, 5vw, 46px);
      margin: 12px 0 18px;
      color: #333;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .button-zone {
      position: relative;
      width: min(520px, 92%);
      height: 160px;
      margin: 0 auto;
      touch-action: none;
    }

    button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      padding: 16px 32px;
      font-size: 20px;
      font-weight: 800;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(155, 81, 224, 0.2);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform .12s cubic-bezier(0.175, 0.885, 0.32, 1.275), background-color .12s ease;
    }

    #yesBtn {
      left: 15%;
      background: linear-gradient(135deg, #a855f7, #7c3aed);
      color: #fff;
    }

    #yesBtn:hover {
      background: linear-gradient(135deg, #9333ea, #6d28d9);
      transform: translateY(-50%) scale(1.05);
    }

    #noBtn {
      left: 60%;
      background: #f3f4f6;
      color: #1f2937;
      border: 1px solid #e5e7eb;
      transition: left 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.1), top 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.1);
    }

    .hint {
      margin-top: 14px;
      font-size: 14px;
      font-weight: 600;
      color: #6b7280;
    }

    .result {
      display: none;
      margin-top: 18px;
      animation: pop .4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .result h2 {
      font-size: clamp(32px, 5vw, 48px);
      margin: 10px 0;
      background: linear-gradient(45deg, #ff007f, #7b2cbf, #00bbf9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 900;
    }

    .fireworks {
      width: min(380px, 90vw);
      margin: 15px auto 0;
      display: block;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
    }

    @keyframes pop {
      from {
        transform: scale(.9);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }
  </style>
</head>

<body>
  <canvas id="confettiCanvas"></canvas>

  <main class="card">
    <!-- CUTE ANIMAL WITH PRIDE/RAINBOW HEART -->
    <svg class="art" viewBox="0 0 320 240" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Rainbow Gradient for Heart -->
        <linearGradient id="rainbowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ff5f6d" />
          <stop offset="50%" stop-color="#ffc371" />
          <stop offset="100%" stop-color="#8a2387" />
        </linearGradient>
        <linearGradient id="fur" x1="0" x2="1">
          <stop offset="0" stop-color="#fce1cf" />
          <stop offset="1" stop-color="#f8cbb0" />
        </linearGradient>
      </defs>

      <!-- Little Rainbow Heart -->
      <path d="M250 50 C250 33 270 25 282 38
               C294 25 314 33 314 50
               C314 78 282 92 282 106
               C282 92 250 78 250 50Z" fill="url(#rainbowGrad)" />

      <!-- Animal Base -->
      <path d="M90 120 C90 70 140 40 190 60
               C240 40 290 70 290 120
               C290 180 240 210 190 210
               C140 210 90 180 90 120Z" fill="url(#fur)" />

      <!-- Ears -->
      <path d="M110 92 L95 55 L140 78 Z" fill="#e0a582" />
      <path d="M270 92 L285 55 L240 78 Z" fill="#e0a582" />

      <!-- Eyes -->
      <circle cx="160" cy="130" r="8" fill="#2d3748" />
      <circle cx="220" cy="130" r="8" fill="#2d3748" />

      <!-- Shy Cheek Blush -->
      <circle cx="145" cy="142" r="10" fill="#ffccd5" opacity="0.8"/>
      <circle cx="235" cy="142" r="10" fill="#ffccd5" opacity="0.8"/>

      <!-- Mouth / Heart Nose -->
      <path d="M190 144 C186 144 182 148 182 152
               C182 160 190 164 190 170
               C190 164 198 160 198 152
               C198 148 194 144 190 144Z" fill="#ff5f6d" />
    </svg>

    <h1>Are you gay? 🏳️‍🌈</h1>

    <section class="button-zone" id="zone">
      <button id="yesBtn">Yes</button>
      <button id="noBtn">No</button>
    </section>

    <!-- HINT -->
    <div class="hint" id="hint">There is no escaping the truth! 🤫</div>

    <section class="result" id="result">
      <h2>I KNEW IT! 🏳️‍🌈✨</h2>
      <img class="fireworks" src="https://media.giphy.com/media/26ufdipQqU2lhNA4g/giphy.gif" alt="Celebration Fireworks" />
    </section>
  </main>

  <script>
    const zone = document.getElementById("zone");
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const result = document.getElementById("result");
    const hint = document.getElementById("hint");

    /* ---------- CONFETTI ---------- */
    const confettiCanvas = document.getElementById("confettiCanvas");

    function resizeConfettiCanvas() {
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      confettiCanvas.width = Math.floor(window.innerWidth * dpr);
      confettiCanvas.height = Math.floor(window.innerHeight * dpr);
      confettiCanvas.style.width = "100vw";
      confettiCanvas.style.height = "100vh";
    }

    resizeConfettiCanvas();
    window.addEventListener("resize", resizeConfettiCanvas);
    window.addEventListener("orientationchange", () => setTimeout(resizeConfettiCanvas, 150));

    const confettiInstance = confetti.create(confettiCanvas, {
      resize: false,
      useWorker: true
    });

    function fullScreenConfetti() {
      const end = Date.now() + 2000;

      (function frame() {
        confettiInstance({
          particleCount: 15,
          spread: 100,
          startVelocity: 45,
          ticks: 200,
          origin: { x: Math.random(), y: Math.random() * 0.4 },
          colors: ['#ff007f', '#ffc371', '#8a2387', '#3a86c8', '#00f5d4', '#fee440']
        });
        if (Date.now() < end) requestAnimationFrame(frame);
      })();

      setTimeout(() => {
        confettiInstance({
          particleCount: 350,
          spread: 160,
          startVelocity: 65,
          ticks: 240,
          origin: { x: 0.5, y: 0.5 },
          colors: ['#ff007f', '#ffc371', '#8a2387', '#3a86c8', '#00f5d4', '#fee440']
        });
      }, 300);
    }

    /* ---------- YES BUTTON GROWS ---------- */
    let yesScale = 1;
    function growYes() {
      yesScale = Math.min(2.5, yesScale + 0.12);
      yesBtn.style.transform = `translateY(-50%) scale(${yesScale})`;
    }

    /* ---------- NO BUTTON RUNS AWAY ---------- */
    function clamp(n, min, max) {
      return Math.max(min, Math.min(max, n));
    }

    function moveNo(px, py) {
      const z = zone.getBoundingClientRect();
      const b = noBtn.getBoundingClientRect();

      // Vector pointing away from the user's cursor / tap coordinate
      let dx = (b.left + b.width / 2) - px;
      let dy = (b.top + b.height / 2) - py;
      
      // If cursor is perfectly aligned, apply some default push direction
      if (dx === 0 && dy === 0) {
        dx = Math.random() - 0.5;
        dy = Math.random() - 0.5;
      }

      let mag = Math.hypot(dx, dy) || 1;
      dx /= mag;
      dy /= mag;

      // Calculate new position inside the interactive zone container
      let newLeft = (b.left - z.left) + dx * 160;
      let newTop = (b.top - z.top) + dy * 160;

      // Keep it fully within zone boundaries
      newLeft = clamp(newLeft, 0, z.width - b.width);
      newTop = clamp(newTop, 0, z.height - b.height);

      noBtn.style.left = newLeft + "px";
      noBtn.style.top = newTop + "px";
      noBtn.style.transform = "none";

      growYes();
    }

    // Trigger movement when mouse hovers / moves near it
    zone.addEventListener("pointermove", e => {
      const b = noBtn.getBoundingClientRect();
      const d = Math.hypot(
        (b.left + b.width / 2) - e.clientX,
        (b.top + b.height / 2) - e.clientY
      );
      // Trigger threshold: runaway starts within 150px
      if (d < 150) {
        moveNo(e.clientX, e.clientY);
      }
    });

    // Mobile Bulletproofing: Teleport button on touch/tap instantly
    noBtn.addEventListener("pointerdown", e => {
      e.preventDefault();
      moveNo(e.clientX, e.clientY);
    });

    noBtn.addEventListener("click", e => {
      e.preventDefault();
    });

    /* ---------- YES CLICK ---------- */
    yesBtn.addEventListener("click", () => {
      zone.style.display = "none";
      hint.style.display = "none";
      result.style.display = "block";
      resizeConfettiCanvas();
      fullScreenConfetti();
    });
  </script>
</body>

</html>
